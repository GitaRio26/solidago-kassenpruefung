<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLIDAGO – Belege senden</title>
<style>
  body{margin:0;font:17px/1.45 system-ui,Roboto,Arial,sans-serif;background:#f5f7f6;color:#1d2421}
  header{background:#fff;border-bottom:1px solid #d8dedb;padding:14px 18px;font-weight:700;color:#3f9a45;font-size:20px}
  header small{display:block;font-weight:400;color:#66706b;font-size:14px}
  main{padding:18px;max-width:560px;margin:0 auto}
  .btn{display:block;width:100%;text-align:center;padding:18px;border-radius:12px;font-size:19px;font-weight:600;margin-bottom:12px;border:2px solid #3f9a45;color:#2c7432;background:#fff}
  .btn.primary{background:#3f9a45;color:#fff}
  input[type=file]{display:none}
  .hint{font-size:14px;color:#66706b;margin:6px 0 16px}
  ul{list-style:none;padding:0;margin:0}
  li{background:#fff;border:1px solid #d8dedb;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;font-size:15px}
  li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ok{color:#2c7432;font-weight:600}.err{color:#c0392b;font-weight:600}.wait{color:#b9770e}
  .count{font-size:15px;margin:14px 0 8px;color:#66706b}
</style>
</head>
<body>
<header>SOLIDAGO Kassenprüfung<small>Belege an den PC senden</small></header>
<main>
  <label class="btn primary">📷 Foto aufnehmen<input id="cam" type="file" accept="image/*" capture="environment" multiple></label>
  <label class="btn">🖼 Bilder oder PDF auswählen<input id="pick" type="file" accept="image/*,application/pdf" multiple></label>
  <p class="hint">Tipp: Zuerst den <b>Antrag</b> fotografieren, danach die <b>dazugehörigen Rechnungen</b>. Blatt flach auf einen dunklen Untergrund legen, ganzes Blatt ins Bild, gutes Licht.</p>
  <div class="count" id="count"></div>
  <ul id="list"></ul>
</main>
<script>
"use strict";
const base = location.pathname.replace(/\/$/, "");
const list = document.getElementById("list");
let queue = Promise.resolve(), sent = 0;
function row(name){ const li=document.createElement("li"); li.innerHTML='<span class="n"></span><span class="s wait">wartet …</span>'; li.querySelector(".n").textContent=name; list.prepend(li); return li.querySelector(".s"); }
function upload(file){
  const st = row(file.name || "Foto");
  queue = queue.then(async ()=>{
    st.textContent = "wird gesendet …";
    try{
      const r = await fetch(base + "/upload?name=" + encodeURIComponent(file.name || "foto.jpg"), {method:"POST", body:file, headers:{"Content-Type":"application/octet-stream"}});
      if(!r.ok) throw new Error(await r.text());
      st.textContent = "✓ am PC angekommen"; st.className = "s ok"; sent++;
      document.getElementById("count").textContent = sent + " Beleg(e) gesendet";
    }catch(e){ st.textContent = "✗ " + (e.message || "Fehler") + " – bitte erneut senden"; st.className = "s err"; }
  });
}
for (const id of ["cam","pick"]) document.getElementById(id).addEventListener("change", e=>{ [...e.target.files].forEach(upload); e.target.value=""; });
</script>
</body>
</html>
